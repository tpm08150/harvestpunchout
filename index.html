<!doctype html>

<title>Harvest Punch-Out</title>
<meta name="description" content="Work your way up from the production managers to the CEO. Learn the tells, dodge, counter, and put them on the canvas.">
<style>

  h1{font-family:'Bungee',cursive;font-size:clamp(15px,2.8vw,26px);

  h1 .brand{color:var(--brand)}
  .sub{font-size:11px;text-transform:uppercase;letter-spacing:2px;opacity:.6}
  .meters{margin-left:auto;display:flex;gap:14px;font-size:11px;
    text-transform:uppercase;letter-spacing:1px}
  .meters b{color:var(--tape);font-weight:600}

  canvas{display:block;width:100%;height:auto;background:#05070B;
    border:2px solid var(--truss);image-rendering:pixelated;touch-action:none;
    -webkit-user-select:none;user-select:none}

  /* Controls sit under the play area rather than over it, so a thumb never
     covers the thing it is reacting to. They are shown on every screen size —
     a break-room touchscreen is as likely as a laptop, and on a laptop they
     double as the key legend. */
  .pad{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .pad button{
    font-family:'IBM Plex Mono',monospace;font-weight:600;
    font-size:13px;letter-spacing:1px;text-transform:uppercase;
    min-height:52px;padding:6px 4px;cursor:pointer;
    background:var(--deck);color:var(--truss);
    border:2px solid var(--truss);border-radius:4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
  }
  .pad button small{font-size:9px;opacity:.5;letter-spacing:1px}
  .pad button:active,.pad button.on{background:var(--truss);color:var(--house);}
  .pad .hit{border-color:var(--clip);color:var(--clip)}
  .pad .hit:active,.pad .hit.on{background:var(--clip);color:var(--house)}
  .pad .star{border-color:var(--tape);color:var(--tape)}
  .pad .star:active,.pad .star.on{background:var(--tape);color:var(--house)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;
    font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.65}
  .legend b{color:var(--xlr);font-weight:600}
  .legend .warn b{color:var(--clip)}

     phone nothing else brings the keyboard up, so a top-ten score with no way
     to sign it is the whole board lost. Same fix both other games needed. */
  .signbox{margin-top:10px;padding:10px;border:2px solid var(--tape);

<body>
<div class="rig">

<script>
(() => {
'use strict';

/* ============================================================================
   Harvest Punch-Out
   ----------------------------------------------------------------------------
   A Punch-Out-shaped fighter: you can't out-mash anyone, you learn their tell
   and you punish it. Everything is drawn in code — no images to fetch, so the
   page is one file, the same as Soundcheck and Out Run.

   The seven are real people here, drawn as caricatures rather than photos: a
   photograph of a colleague being punched is a different thing entirely, and
   the drawn version is both kinder and about 60KB lighter.

   Order is the org chart, easiest first: three production managers, then the
   warehouse, then CTO, COO, CEO. Reordering is reordering ROSTER — the circuit
   reads it in array order and nothing else knows the sequence.
   ========================================================================== */

const W = 420, H = 300;
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');

/* ---------------------------------------------------------------------------
   The roster.

   `look` is the caricature; `fight` is how they behave. The two are deliberately
   separate — swapping somebody's hair colour should never change how hard they
   hit, and giving a fighter a new move should never mean re-drawing them.

   tell   how long the wind-up lasts, in ms. This is the whole difficulty curve:
          Wooten telegraphs for 0.7s, Koan for a third of that.
   dodge  'L', 'R' or 'any' — which way you have to move.
   block  false means blocking does nothing. Those flash red.
   ctr    whether punching during the wind-up counters it for a star.
-------------------------------------------------------------------------- */

const M = {
  hookL: (tell, dmg) => ({ k:'hookL', tell, dmg, dodge:'L', block:true,  ctr:true,  act:130, rec:430 }),
  hookR: (tell, dmg) => ({ k:'hookR', tell, dmg, dodge:'R', block:true,  ctr:true,  act:130, rec:430 }),
  jab:   (tell, dmg) => ({ k:'jab',   tell, dmg, dodge:'any', block:true,  ctr:true,  act:100, rec:300 }),
  low:   (tell, dmg) => ({ k:'low',   tell, dmg, dodge:'any', block:false, ctr:true,  act:130, rec:460 }),
  upper: (tell, dmg) => ({ k:'upper', tell, dmg, dodge:'any', block:false, ctr:false, act:170, rec:620 }),
  feint: (tell)      => ({ k:'feint', tell, dmg:0, dodge:'any', block:true, ctr:false, act:60, rec:220 }),
};

const ROSTER = [

      crop:{ style:'bald', vol:0, part:0, temples:1, overEar:0 },

      glasses:{ shape:'rect', w:1.00, h:0.92, frame:'#2B3038', th:1.35, tint:0.06 },

      lips:{ w:1.0, th:0.95 }, smile:'closed',

            moves:[ M.hookL(620,13), M.hookR(620,13), M.low(600,12), M.upper(900,22) ] },

    look:{

      // Short, and going back at the temples.
      crop:{ style:'short', vol:0.92, part:1, temples:0.35, overEar:0 },
      brow:{ th:1.1, angle:0.08, gap:1.0 },
      // Thick, jaw-covering, well kept — full but nothing like Casey's.
      beard:{ type:'full', len:12, col:'#33261C', flare:0.90 },
      glasses:null,
      ear:{ studs:false },
      nose:{ ring:null, w:1.05, len:0.95 },

    },
    fight:{ hp:116, gap:[800,1300], guard:0.45, combo:2, rally:null,
            moves:[ M.jab(360,6), M.hookL(460,10), M.hookR(460,10), M.low(480,11), M.feint(500) ] },
  },
  {
    id:'morton', nick:'OVERTIME', name:'Tyler Morton', title:'Chief Operations Officer',
    corner:'#8BC542',
    line:'Fine for two rounds. Hurt him and he gets faster, not slower.',
    look:{
      skin:'#F2CBA8', hair:'#3B2A1D', build:1.06, seed:5,
      trunk:'#8BC542', belt:'#3F6B15', glove:'#1B1F24',
      face:{ w:1.04, jaw:0.98, chin:0.40, cheek:0.66, chins:0.20 },
      crop:{ style:'wave', vol:1.18, part:1, temples:0.15, overEar:0.10 },
      brow:{ th:1.0, angle:0.10, gap:1.0 },

      beard:{ type:'short', len:5, col:'#3B2A1D', flare:0.84 },

      face:{ w:1.04, jaw:0.96, chin:0.46, cheek:0.58, chins:0.15 },
      // Long, and pulled back off the face rather than hanging.
      crop:{ style:'back', vol:1.12, part:0, temples:0, overEar:0.20 },
      brow:{ th:1.05, angle:0.08, gap:1.0 },

                    M.upper(620,26), M.feint(420) ] },
