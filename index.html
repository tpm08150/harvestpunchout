/* --------------------------------------------------------------------------
   Player constants. Tuned so a fight is 40–90 seconds: long enough to have a
   shape, short enough to have another go on a break.

   Stamina ("hearts", cabinet-authentic) is what stops mashing. Throwing into a
   guard costs far more than landing one, so the punishment for not waiting is
   that you run out of punches exactly when the opening arrives.
-------------------------------------------------------------------------- */
const P = {
  hp:100, upHp:65, hearts:24,
  dmgFace:5, dmgBody:4, dmgStar:25,
  ctrMul:3.0, whiffMul:2.0, guardBodyMul:0.5,
  costLand:1, costGuard:3, costMiss:2, costTaken:3,
  regen:1/650,                 // hearts per ms while not throwing
  gassed:2400,                 // ms with no punches once hearts hit zero
  punchWind:70, punchAct:70, punchRec:150,
  starWind:230, starAct:120, starRec:420,
  dodgeDur:400, dodgeInv:270,  // the first 270ms of a dodge is the actual dodge
  hurtDur:460,
  maxStars:3,
};

const ROUNDS = 3, ROUND_MS = 60000, REST_MS = 4200, COUNT_MS = 9000;

/* ============================ audio ====================================== */
/* One voice per continuous sound, created once and modulated — never a node per
   frame. Out Run's notes on that hold here: spawning nodes at 60fps gives you a
   click track and eventually stalls the context. */
const Snd = (() => {
  let ac = null, master = null, sfx = null, mus = null, on = true, music = true, dead = false;
  let crowd = null, crowdGain = null;

  function ensure() {
    if (ac) return ac;
    if (dead) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.0; mus.connect(master);

    // Crowd: filtered noise, always running, its level pushed around by events.
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    crowd = ac.createBufferSource(); crowd.buffer = buf; crowd.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
    crowdGain = ac.createGain(); crowdGain.gain.value = 0.05;
    crowd.connect(bp); bp.connect(crowdGain); crowdGain.connect(master);
    crowd.start();
    return ac;
    } catch (err) {
      // ⚠️ Audio must never be able to stop the game responding. `resume()` is
      // called first thing on every click and every keypress, so anything
      // thrown in here would take the input with it and the page would look
      // dead to the touch. Give up on sound instead.
      dead = true; ac = null;
      return null;
    }
  }

  // ⚠️ Never start or resume while the page is hidden. visibilitychange only
  // fires on a CHANGE, so a page that *loads* hidden — a background tab, or the
  // Arcade iframe in a tab that is not on screen — never gets the event and
  // would happily play to nobody for as long as it stays open.
  const hidden = () => typeof document !== 'undefined' && document.hidden;

  function resume() {
    if (hidden()) return;
    const a = ensure();
    if (!a || a.state !== 'suspended') return;
    try { const p = a.resume(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* autoplay policy */ }
  }

  // Suspending the whole context is the only thing that reliably stops every
  // voice at once — the crowd is a looping buffer with no natural end, so
  // ducking gains leaves it running for as long as the page is open.
  function suspend() { if (ac && ac.state === 'running') ac.suspend(); }
  function wake() {
    if (!ac || hidden()) return;
    if (ac.state === 'suspended') {
      const p = ac.resume();
      if (p && p.then) p.then(() => { nextNote = ac.currentTime + 0.05; }, () => {});
    }
  }

  function blip(freq, dur, type, gain, slideTo) {
    if (!on) return; const a = ensure(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), a.currentTime + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.18, a.currentTime + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(sfx); o.start(); o.stop(a.currentTime + dur + 0.02);
  }

  function noise(dur, freq, gain, q) {
    if (!on) return; const a = ensure(); if (!a) return;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = a.createGain(); g.gain.value = gain || 0.3;
    s.connect(f); f.connect(g); g.connect(sfx); s.start();
  }

  // The music is a four-bar walk-out loop, scheduled with a lookahead the same
  // shape Out Run and Soundcheck use — setInterval cannot place a note on a beat.
  const BASS = [0,0,3,3, 5,5,3,3, 0,0,-2,-2, 5,5,7,7];
  const LEAD = [12,null,10,12, null,15,null,12, 10,null,8,10, null,7,null,null];
  let step = 0, nextNote = 0, timer = null;
  const BPM = 132, SPB = 60 / BPM / 2;

  function hz(semi) { return 110 * Math.pow(2, semi / 12); }
  function tone(dest, freq, at, dur, type, gain) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dest); o.start(at); o.stop(at + dur + 0.02);
  }
  function schedule() {
    if (!ac) return;
    while (nextNote < ac.currentTime + 0.12) {
      const i = step % 16;
      tone(mus, hz(BASS[i]), nextNote, SPB * 0.9, 'square', 0.16);
      if (LEAD[i] !== null) tone(mus, hz(LEAD[i] + 12), nextNote, SPB * 0.8, 'triangle', 0.10);
      if (i % 4 === 0) {
        const n = ac.createBufferSource();
        const len = Math.floor(ac.sampleRate * 0.06), b = ac.createBuffer(1, len, ac.sampleRate);
        const d = b.getChannelData(0);
        for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / len);
        n.buffer = b; const g = ac.createGain(); g.gain.value = 0.10;
        n.connect(g); g.connect(mus); n.start(nextNote);
      }
      nextNote += SPB; step++;
    }
  }

  return {
    kick() {
      if (hidden()) return;
      const a = ensure(); if (!a) return;
      // The clock does not advance while suspended, so rebase on resume or the
      // scheduler dumps every sixteenth it missed at once.
      if (a.state === 'suspended') a.resume().then(() => { nextNote = a.currentTime + 0.05; });
      if (nextNote < a.currentTime) nextNote = a.currentTime + 0.05;
      if (!timer) timer = setInterval(schedule, 25);
      mus.gain.setTargetAtTime(music && on ? 0.22 : 0.0, a.currentTime, 0.3);
    },
    toggleMusic() { music = !music; const a = ensure(); if (a) mus.gain.setTargetAtTime(music && on ? 0.22 : 0, a.currentTime, 0.1); return music; },
    duckMusic(v) { const a = ensure(); if (a) mus.gain.setTargetAtTime(music && on ? v : 0, a.currentTime, 0.2); },
    crowd(level) { const a = ensure(); if (a && crowdGain) crowdGain.gain.setTargetAtTime(level, a.currentTime, 0.4); },
    suspend, wake,
    bell() { blip(880, 0.5, 'sine', 0.3); blip(1320, 0.6, 'sine', 0.18); },
    land() { noise(0.10, 340, 0.42, 0.8); blip(150, 0.07, 'square', 0.14, 60); },
    big()  { noise(0.20, 190, 0.60, 0.7); blip(90, 0.16, 'square', 0.22, 40); },
    block(){ noise(0.07, 1600, 0.22, 3); },
    miss() { noise(0.09, 2600, 0.10, 4); },
    hurt() { blip(220, 0.16, 'sawtooth', 0.18, 90); noise(0.12, 260, 0.34, 0.9); },
    star() { blip(660, 0.09, 'square', 0.2); blip(990, 0.12, 'square', 0.18); blip(1320, 0.16, 'square', 0.16); },
    down() { blip(180, 0.5, 'sawtooth', 0.26, 50); noise(0.4, 140, 0.4, 0.6); },
    count(){ blip(520, 0.12, 'sine', 0.22); },
    win()  { [0,120,240,420].forEach((d,i) => setTimeout(() => blip([523,659,784,1047][i], 0.25, 'square', 0.2), d)); },
    resume,
  };
})();

/* ============================ board ====================================== */
const API = '/api/scores';
let BOARD = [];            // rows from the function (or from this browser)
let BOARD_LIVE = false;    // whether the function answered
const LOCAL_KEY = 'harvest-punchout-board';
const PROG_KEY  = 'harvest-punchout-progress';

function localBoard() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { return []; }
}
function saveLocal(rows) {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(rows)); } catch (e) { /* private mode */ }
}
function trimLocal(rows) {
  const out = [];
  for (const who of [...ROSTER.map(r => r.id), 'circuit']) {
    out.push(...rows.filter(r => r.who === who).sort((a, b) => a.time - b.time).slice(0, 10));
  }
  return out;
}

async function loadBoard() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error('no function');
    BOARD = await r.json();
    BOARD_LIVE = true;
  } catch (e) {
    BOARD = localBoard();
    BOARD_LIVE = false;
  }
  paintBoards();
}

async function postScore(name, time, who) {
  if (BOARD_LIVE) {
    try {
      const r = await fetch(API, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, time, who }),
      });
      if (r.ok) { BOARD = await r.json(); paintBoards(); return true; }
    } catch (e) { /* fall through to local */ }
  }
  BOARD = trimLocal([...BOARD, { name, time, who, when: Date.now() }]);
  saveLocal(BOARD);
  paintBoards();
  return false;
}

const fmt = (s) => {
  const m = Math.floor(s / 60), r = s - m * 60;
  return m > 0 ? `${m}:${r.toFixed(1).padStart(4, '0')}` : `${r.toFixed(1)}s`;
};

function rowsFor(who) {
  return BOARD.filter(r => r.who === who).sort((a, b) => a.time - b.time).slice(0, 10);
}

function paintBoards() {
  document.getElementById('boardMode').textContent =
    BOARD_LIVE ? '— live' : '— this browser only';
  document.getElementById('mBoard').textContent = BOARD_LIVE ? 'LIVE' : 'LOCAL';

  const grid = document.getElementById('boardGrid');
  grid.innerHTML = '';

  const make = (title, sub, who, cls) => {
    const rows = rowsFor(who);
    const el = document.createElement('div');
    el.className = 'board' + (cls ? ' ' + cls : '');
    const list = rows.length
      ? `<ol>${rows.map((r, i) =>
          `<li><span class="r">${i + 1}</span><span class="n">${r.name}</span><span class="t">${fmt(r.time)}</span></li>`
        ).join('')}</ol>`
      : '<div class="empty">Nobody yet</div>';
    el.innerHTML = `<h3>${title}<em>${sub}</em></h3>${list}`;
    grid.appendChild(el);
  };

  make('The full circuit', 'All seven, one run', 'circuit', 'circuit');
  ROSTER.forEach(f => make(f.nick, f.name, f.id));
}

function progress() {
  try { return Math.max(0, Math.min(ROSTER.length, Number(localStorage.getItem(PROG_KEY)) || 0)); }
  catch (e) { return 0; }
}
function setProgress(n) {
  try { localStorage.setItem(PROG_KEY, String(n)); } catch (e) { /* private mode */ }
  document.getElementById('mBeaten').textContent = `${Math.min(n, ROSTER.length)}/${ROSTER.length}`;
}

/* ============================ input ====================================== */
/* Edge-triggered actions go on a queue and are consumed by the update, so a tap
   that lands between frames is never lost. Held state (block) is read directly. */
const held = { dodgeL:false, dodgeR:false, block:false };
let queued = null;
const q = (a) => { queued = a; };

const KEYMAP = {
  ArrowLeft:'dodgeL', KeyA:'dodgeL',
  ArrowRight:'dodgeR', KeyD:'dodgeR',
  ArrowDown:'block', KeyS:'block',
  KeyZ:'face', KeyJ:'face',
  KeyX:'body', KeyK:'body',
  Space:'star',
};

// ⚠️ Any keystroke aimed at an input belongs to the input. Both other games shipped
// with single-letter shortcuts eating characters out of the name box; this is a
// target check rather than a game-state one so the next shortcut added can't
// reintroduce it.
const typing = (e) => {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
};

addEventListener('keydown', (e) => {
  if (typing(e)) return;
  Snd.resume();
  if (e.code === 'KeyM') { Snd.toggleMusic(); e.preventDefault(); return; }
  if (e.code === 'KeyP') { togglePause(); e.preventDefault(); return; }
  // Anything else while paused simply un-pauses. Being stuck behind one
  // undiscoverable key is what made this look broken rather than paused.
  if (G.paused) { resumeIfPaused(); e.preventDefault(); return; }
  if (e.code === 'Enter') { advance(); e.preventDefault(); return; }
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  if (e.repeat) return;
  if (a === 'block') { held.block = true; }
  else if (a === 'dodgeL' || a === 'dodgeR') { held[a] = true; q(a); }
  else q(a);
  if (G.screen !== 'fight') advance();
});

addEventListener('keyup', (e) => {
  if (typing(e)) return;
  const a = KEYMAP[e.code];
  if (a && a in held) held[a] = false;
});

// Touch / mouse pad. `pointerdown` fires for both, and the button keeps its own
// pressed look through the CSS :active plus an `on` class for held controls.
document.querySelectorAll('.pad button').forEach(btn => {
  const act = btn.dataset.act;
  const down = (e) => {
    e.preventDefault();
    try { window.focus(); } catch (err) { /* not embedded */ }
    Snd.resume();
    if (resumeIfPaused()) return;
    if (act === 'block') { held.block = true; btn.classList.add('on'); }
    else if (act === 'dodgeL' || act === 'dodgeR') { held[act] = true; q(act); }
    else q(act);
    if (G.screen !== 'fight') advance();
  };
  const up = (e) => {
    e.preventDefault();
    if (act === 'block') { held.block = false; btn.classList.remove('on'); }
    if (act in held) held[act] = false;
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
});

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  // ⚠️ Embedded in the Hub's Arcade this page is a cross-origin iframe, and keys
  // only reach it once it holds focus. preventDefault above stops the browser
  // giving it focus by itself, so ask for it.
  try { window.focus(); } catch (err) { /* not embedded, or refused */ }
  Snd.resume();
  if (resumeIfPaused()) return;   // a click is how most people will try to resume
  if (G.screen !== 'fight') advance();
});

/* ============================ game state ================================= */
const G = {
  screen:'title',      // title | select | fight | result | done
  idx:0,               // who is next in the circuit
  fight:null,
  run:null,            // an in-progress circuit: {from, total, alive}
  paused:false,
  flash:0, shake:0,
  msg:'', msgT:0,
  pending:null,        // a score waiting on initials
};

setProgress(progress());
G.idx = Math.min(progress(), ROSTER.length - 1);

function newFight(i) {
  const R = ROSTER[i], F = R.fight;
  return {
    i, R,
    phase:'intro', pt:0,
    round:1, roundLeft:ROUND_MS, clock:0,
    opp:{
      hp:F.hp, max:F.hp, downs:0,
      state:'idle', t:0, dur:900, move:null,
      chain:0, rally:false, flash:0,
    },
    you:{ hp:P.hp, hearts:P.hearts, stars:0, downs:0,
          state:'idle', t:0, dur:0, punch:null, gassedT:0, flash:0 },
    count:0, mash:0,
    result:null,
  };
}

function startFight(i) {
  G.fight = newFight(i);
  G.screen = 'fight';
  Snd.kick(); Snd.crowd(0.06);
}

/* `advance` is the one "any button continues" handler, so Enter, a tap on the
   canvas and a pad button all do the same thing on every non-fighting screen. */
function advance() {
  if (G.screen === 'title') {
    G.screen = 'select';
    Snd.kick();
    Snd.crowd(0);
  } else if (G.screen === 'select') {
    // Starting from the top of the ladder starts a circuit run; picking up
    // mid-ladder does not, because a circuit time has to cover all seven.
    G.run = G.idx === 0 ? { total:0, alive:true } : null;
    startFight(G.idx);
  } else if (G.screen === 'result') {
    if (G.pending) return;               // sign it first
    const f = G.fight;
    if (f && f.result === 'win') {
      if (G.idx >= ROSTER.length - 1) { G.screen = 'done'; }
      else { G.idx += 1; G.screen = 'select'; }
    } else {
      G.screen = 'select';
    }
    G.fight = null;
    Snd.crowd(0);          // off a fight screen there is no crowd to hear
  } else if (G.screen === 'done') {
    G.screen = 'select';
    Snd.crowd(0);
  }
}

/** Resume from pause. Returns true if it actually did something, so callers can
 *  swallow the interaction that resumed rather than also acting on it. */
function resumeIfPaused() {
  if (!G.paused) return false;
  G.paused = false;
  Snd.wake();
  return true;
}

function togglePause() {
  if (G.screen !== 'fight') return;
  G.paused = !G.paused;
  // Suspend rather than duck. Paused used to leave the crowd and the engine of
  // the music running, which is the same complaint as a backgrounded tab.
  if (G.paused) Snd.suspend(); else Snd.wake();
}

/* ============================ fight logic ================================ */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function say(msg, ms) { G.msg = msg; G.msgT = ms || 900; }

function oppSpeed(f) {
  // Rally: below the threshold the fighters who have one get quicker, not
  // slower. It is the only place the numbers change mid-fight, and it is what
  // makes the last quarter of Morton and Koan feel different from the first.
  const R = f.R.fight;
  if (!R.rally) return 1;
  const low = f.opp.hp / f.opp.max <= R.rally.at;
  f.opp.rally = low;
  return low ? R.rally.speed : 1;
}

function chooseAction(f) {
  const o = f.opp, R = f.R.fight, sp = oppSpeed(f);
  if (Math.random() < R.guard && o.chain === 0) {
    o.state = 'guard'; o.t = 0; o.dur = rnd(500, 1100) * sp;
    return;
  }
  const mv = pick(R.moves);
  o.move = mv; o.state = 'wind'; o.t = 0; o.dur = Math.max(140, mv.tell * sp);
}

function idleGap(f) {
  const R = f.R.fight, sp = oppSpeed(f);
  f.opp.state = 'idle'; f.opp.t = 0;
  f.opp.dur = rnd(R.gap[0], R.gap[1]) * sp;
  f.opp.chain = 0;
}

/** The moment a strike becomes active: did it land, get blocked, or miss? */
function resolveStrike(f) {
  const o = f.opp, y = f.you, mv = o.move;

  if (mv.k === 'feint') {
    // A feint hits nothing. Its whole job is to make you move — and if it did,
    // the follow-up is already in the air before you are back on your feet.
    if (y.state === 'dodge') {
      o.move = M.jab(120, Math.round(6 * (f.R.fight.moves[0].dmg / 6)));
      o.state = 'wind'; o.t = 0; o.dur = 120; o.chain++;
      say('FEINT!', 700);
    } else {
      idleGap(f);
    }
    return;
  }

  const dodging = y.state === 'dodge' && y.t <= P.dodgeInv;
  const rightWay = mv.dodge === 'any' || (mv.dodge === 'L' && y.punch === 'L') || (mv.dodge === 'R' && y.punch === 'R');

  if (dodging && rightWay) {
    // Dodged clean. They are wide open until they recover — this is where the
    // damage actually comes from, not from trading.
    o.state = 'whiff'; o.t = 0; o.dur = 720;
    Snd.miss();
    say('DODGED', 550);
    return;
  }

  if (y.state === 'down') { idleGap(f); return; }

  const blocked = held.block && mv.block && y.state !== 'dodge';
  const dmg = mv.dmg;

  if (blocked) {
    y.hp -= dmg * 0.25;
    y.hearts -= P.costGuard;
    Snd.block();
    say('BLOCKED', 450);
  } else {
    y.hp -= dmg;
    y.hearts -= P.costTaken;
    y.state = 'hurt'; y.t = 0; y.dur = P.hurtDur;
    y.flash = 1;
    G.shake = Math.min(9, 3 + dmg * 0.4);
    if (dmg >= 10 && y.stars > 0) y.stars -= 1;   // a real shot rattles a star loose
    Snd.hurt();
    if (mv.k === 'low') say('BODY SHOT', 600);
  }

  y.hearts = Math.max(0, y.hearts);
  if (y.hearts === 0) y.gassedT = P.gassed;

  if (y.hp <= 0) { knockDownPlayer(f); return; }

  o.state = 'recover'; o.t = 0; o.dur = mv.rec;
}

function knockDownPlayer(f) {
  const y = f.you;
  y.hp = 0; y.downs += 1; y.state = 'down'; y.t = 0;
  f.phase = 'downYou'; f.pt = 0; f.count = 0; f.mash = 0;
  Snd.down(); Snd.crowd(0.14);
  G.shake = 10;
  if (y.downs >= 3) { finish(f, 'loss', 'TKO — three times down'); }
}

function knockDownOpp(f) {
  const o = f.opp;
  o.hp = 0; o.downs += 1; o.state = 'down'; o.t = 0;
  f.phase = 'downOpp'; f.pt = 0; f.count = 0;
  Snd.down(); Snd.crowd(0.20);
  G.shake = 10; G.flash = 1;
  if (o.downs >= 3) { finish(f, 'win', 'TKO'); }
}

function finish(f, result, why) {
  f.result = result; f.why = why;
  f.phase = 'over'; f.pt = 0;
  Snd.duckMusic(0.05);
  if (result === 'win') { Snd.win(); Snd.crowd(0.22); }
  else { Snd.crowd(0.03); }
}

/** Land one of the player's punches. */
function landPunch(f, aim, star) {
  const o = f.opp, y = f.you;
  let dmg = star ? P.dmgStar : (aim === 'face' ? P.dmgFace : P.dmgBody);
  let kind = 'hit';

  if (star) {
    y.stars -= 1;
    dmg = P.dmgStar; kind = 'star';
    Snd.star(); Snd.big();
    o.state = 'stun'; o.t = 0; o.dur = 1100;
    say('STAR PUNCH!', 900);
  } else if (o.state === 'wind' && o.move && o.move.ctr && o.t / o.dur >= 0.55) {
    // Countered mid-wind-up. The star is the reward for reading the tell, and
    // it is the only way to earn one — you cannot grind them out.
    dmg *= P.ctrMul; kind = 'counter';
    if (y.stars < P.maxStars) y.stars += 1;
    o.state = 'stun'; o.t = 0; o.dur = 950;
    Snd.big(); Snd.star();
    say('COUNTER! ★', 900);
  } else if (o.state === 'whiff' || o.state === 'stun') {
    dmg *= P.whiffMul; kind = 'punish';
    Snd.land();
  } else if (o.state === 'guard') {
    if (aim === 'face') {
      // Guard is up: the face is not available, and throwing at it is what
      // empties your stamina. The body is the answer, and half damage is the
      // price of it being the answer.
      dmg = 0; kind = 'guarded';
      y.hearts = Math.max(0, y.hearts - P.costGuard);
      Snd.block(); say('GUARDED', 400);
    } else {
      dmg *= P.guardBodyMul; kind = 'body';
      Snd.land();
    }
  } else {
    Snd.land();
  }

  if (dmg > 0) {
    o.hp -= dmg; o.flash = 1;
    y.hearts = Math.max(0, y.hearts - P.costLand);
    G.shake = Math.max(G.shake, kind === 'star' ? 8 : 2.5);
    if (o.hp <= 0) { knockDownOpp(f); return; }
    // A solid shot interrupts whatever they were doing.
    if ((kind === 'counter' || kind === 'star') === false && o.state !== 'stun') {
      if (dmg >= 8) { o.state = 'stun'; o.t = 0; o.dur = 420; }
    }
  }
  if (y.hearts === 0) y.gassedT = P.gassed;
}

function tryAction(f, act) {
  const y = f.you;
  if (f.phase !== 'fight') return;
  if (y.state === 'hurt' || y.state === 'down') return;

  if (act === 'dodgeL' || act === 'dodgeR') {
    if (y.state === 'punch' || y.state === 'star') return;
    y.state = 'dodge'; y.t = 0; y.dur = P.dodgeDur;
    y.punch = act === 'dodgeL' ? 'L' : 'R';
    return;
  }

  if (y.state !== 'idle') return;

  if (act === 'star') {
    if (y.stars < 1) { say('NO STARS', 500); return; }
    y.state = 'star'; y.t = 0; y.dur = P.starWind + P.starAct + P.starRec;
    y.punch = 'star'; y.aim = 'face'; y.done = false;
    return;
  }

  if (act === 'face' || act === 'body') {
    if (y.gassedT > 0 || y.hearts <= 0) { Snd.miss(); say('OUT OF STEAM', 600); return; }
    y.state = 'punch'; y.t = 0; y.dur = P.punchWind + P.punchAct + P.punchRec;
    y.punch = Math.random() < 0.5 ? 'L' : 'R';   // hands alternate for looks only
    y.aim = act; y.done = false;
  }
}

function updateFight(dt) {
  const f = G.fight;
  if (!f) return;
  f.pt += dt;

  /* ---- phases that are not the fight itself ---- */
  if (f.phase === 'intro') {
    if (f.pt > 2600) { f.phase = 'ready'; f.pt = 0; Snd.bell(); }
    return;
  }
  if (f.phase === 'ready') {
    if (f.pt > 1500) { f.phase = 'fight'; f.pt = 0; idleGap(f); }
    return;
  }
  if (f.phase === 'rest') {
    f.clock += dt;
    if (f.pt > REST_MS) {
      f.round += 1; f.roundLeft = ROUND_MS;
      f.you.hearts = P.hearts;
      f.you.hp = Math.min(P.hp, f.you.hp + 25);
      f.phase = 'ready'; f.pt = 0; Snd.bell();
    }
    return;
  }
  if (f.phase === 'downOpp') {
    f.clock += dt;
    const was = Math.floor(f.count);
    f.count += dt / 1000;
    if (Math.floor(f.count) !== was && f.count < 10) Snd.count();
    if (f.opp.downs >= 3) { if (f.pt > 1800) finish(f, 'win', 'TKO'); return; }
    if (f.count >= 10) { finish(f, 'win', 'KNOCKOUT'); return; }
    // They get up somewhere in the middle of the count, later each time down.
    if (f.count >= 3 + f.opp.downs * 1.6) {
      f.opp.hp = f.opp.max * 0.55; f.opp.state = 'idle'; f.opp.t = 0;
      f.phase = 'fight'; f.pt = 0; idleGap(f); Snd.crowd(0.09);
    }
    return;
  }
  if (f.phase === 'downYou') {
    f.clock += dt;
    const was = Math.floor(f.count);
    f.count += dt / 1000;
    if (Math.floor(f.count) !== was && f.count < 10) Snd.count();
    if (f.you.downs >= 3) { if (f.pt > 1800) finish(f, 'loss', 'TKO — three times down'); return; }
    // Mash to get up. The bar drains, so it is a real ask rather than a wait.
    if (queued === 'face' || queued === 'body' || queued === 'star') { f.mash += 0.10; queued = null; }
    f.mash = Math.max(0, f.mash - dt / 4200);
    if (f.mash >= 1) {
      f.you.hp = P.upHp; f.you.hearts = P.hearts; f.you.state = 'idle'; f.you.t = 0;
      f.phase = 'fight'; f.pt = 0; f.mash = 0;
      say('UP!', 700);
      return;
    }
    if (f.count >= COUNT_MS / 1000) { finish(f, 'loss', 'Counted out'); }
    return;
  }
  if (f.phase === 'over') return;

  /* ---- the fight ---- */
  f.clock += dt;
  f.roundLeft -= dt;
  if (f.roundLeft <= 0) {
    Snd.bell();
    if (f.round >= ROUNDS) { finish(f, 'loss', 'Went the distance — you need the knockout'); return; }
    f.phase = 'rest'; f.pt = 0; f.roundLeft = 0;
    f.opp.state = 'idle'; f.opp.t = 0; f.you.state = 'idle';
    return;
  }

  const y = f.you, o = f.opp;

  /* player */
  if (queued) { tryAction(f, queued); queued = null; }
  y.t += dt;
  if (y.gassedT > 0) y.gassedT -= dt;
  if (y.state === 'idle' && y.hearts < P.hearts) y.hearts = Math.min(P.hearts, y.hearts + dt * P.regen);
  if (y.flash > 0) y.flash = Math.max(0, y.flash - dt / 260);

  if (y.state === 'punch' || y.state === 'star') {
    const windEnd = y.state === 'star' ? P.starWind : P.punchWind;
    const actEnd = windEnd + (y.state === 'star' ? P.starAct : P.punchAct);
    if (!y.done && y.t >= windEnd && y.t < actEnd + 40) {
      y.done = true;
      if (o.state === 'down') { /* nothing to hit */ }
      else landPunch(f, y.aim, y.state === 'star');
      if (!y.done) y.done = true;
    }
    if (y.t >= y.dur) { y.state = 'idle'; y.t = 0; }
  } else if (y.state === 'dodge') {
    if (y.t >= y.dur) { y.state = 'idle'; y.t = 0; }
  } else if (y.state === 'hurt') {
    if (y.t >= y.dur) { y.state = 'idle'; y.t = 0; }
  }

  /* opponent */
  if (f.phase !== 'fight') return;
  o.t += dt;
  if (o.flash > 0) o.flash = Math.max(0, o.flash - dt / 220);

  switch (o.state) {
    case 'idle':
      if (o.t >= o.dur) chooseAction(f);
      break;
    case 'guard':
      if (o.t >= o.dur) idleGap(f);
      break;
    case 'wind':
      if (o.t >= o.dur) { o.state = 'strike'; o.t = 0; o.dur = o.move.act; resolveStrike(f); }
      break;
    case 'strike':
      if (o.t >= o.dur) { if (o.state === 'strike') { o.state = 'recover'; o.t = 0; o.dur = o.move.rec; } }
      break;
    case 'recover': {
      if (o.t >= o.dur) {
        const R = f.R.fight;
        if (o.chain < R.combo - 1 && Math.random() < 0.72) { o.chain++; chooseAction(f); }
        else idleGap(f);
      }
      break;
    }
    case 'whiff':
      if (o.t >= o.dur) idleGap(f);
      break;
    case 'stun':
      if (o.t >= o.dur) idleGap(f);
      break;
  }
}

/* ============================ results ==================================== */
function onFightOver() {
  const f = G.fight;
  const secs = f.clock / 1000;

  if (f.result === 'win') {
    if (f.i + 1 > progress()) setProgress(f.i + 1);
    if (G.run && G.run.alive) {
      G.run.total += secs;
      if (f.i === ROSTER.length - 1) {
        // A circuit time only exists if every fight in it was in this run.
        queueScore(G.run.total, 'circuit');
        G.run = null;
      }
    }
    queueScore(secs, f.R.id);
  } else if (G.run) {
    // A loss does not void the run — the time you spent losing still counts,
    // which is the honest way to price a retry.
    G.run.total += secs;
  }
  G.screen = 'result';
}

function makesBoard(time, who) {
  const rows = rowsFor(who);
  return rows.length < 10 || time < rows[rows.length - 1].time;
}

const signbox = document.getElementById('signbox');
const initials = document.getElementById('initials');
const signNote = document.getElementById('signNote');

let signQueue = [];
function queueScore(time, who) {
  if (!makesBoard(time, who)) return;
  signQueue.push({ time, who });
  if (!G.pending) nextSign();
}
function nextSign() {
  G.pending = signQueue.shift() || null;
  if (!G.pending) { signbox.classList.remove('show'); return; }
  const who = G.pending.who;
  const label = who === 'circuit' ? 'the full circuit' : (ROSTER.find(r => r.id === who) || {}).nick;
  signNote.textContent = `${fmt(G.pending.time)} on ${label}`;
  signbox.classList.add('show');
  try { initials.value = localStorage.getItem('harvest-punchout-name') || ''; } catch (e) { /* ignore */ }
  setTimeout(() => initials.focus(), 30);
}
async function saveSign() {
  if (!G.pending) return;
  const name = (initials.value || 'AAA').replace(/[^A-Za-z0-9]/g, '').slice(0, 3).toUpperCase() || 'AAA';
  try { localStorage.setItem('harvest-punchout-name', name); } catch (e) { /* ignore */ }
  const { time, who } = G.pending;
  G.pending = null;
  signbox.classList.remove('show');
  await postScore(name, time, who);
  nextSign();
}
document.getElementById('signSave').addEventListener('click', saveSign);
initials.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveSign(); } });

/* ============================ drawing ==================================== */
const FLOOR = 236;          // where the opponent's feet sit
const OX = W / 2;           // ring centre

function rr(x, y, w, h, r, fill) {
  cx.fillStyle = fill;
  cx.beginPath();
  const rad = Math.min(r, w / 2, h / 2);
  cx.moveTo(x + rad, y);
  cx.arcTo(x + w, y, x + w, y + h, rad);
  cx.arcTo(x + w, y + h, x, y + h, rad);
  cx.arcTo(x, y + h, x, y, rad);
  cx.arcTo(x, y, x + w, y, rad);
  cx.closePath(); cx.fill();
}
function circle(x, y, r, fill) { cx.fillStyle = fill; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); }
function ellipse(x, y, rx, ry, fill) { cx.fillStyle = fill; cx.beginPath(); cx.ellipse(x, y, rx, ry, 0, 0, 7); cx.fill(); }
function text(s, x, y, size, fill, align, font) {
  cx.font = `${size}px ${font || "'Bungee', cursive"}`;
  cx.fillStyle = fill; cx.textAlign = align || 'center'; cx.textBaseline = 'alphabetic';
  cx.fillText(s, x, y);
}
function mono(s, x, y, size, fill, align) {
  text(s, x, y, size, fill, align, "'IBM Plex Mono', monospace");
}

/* --- the ring ------------------------------------------------------------ */
let crowdSeed = [];
for (let i = 0; i < 150; i++) {
  crowdSeed.push({ x: Math.random() * W, y: 34 + Math.random() * 52, r: 2 + Math.random() * 3.2, h: Math.random() });
}

function drawRing(t) {
  // house
  cx.fillStyle = '#05070B'; cx.fillRect(0, 0, W, H);

  // crowd — dark heads that bob, brighter when the crowd is loud
  const lively = 0.4 + Math.min(0.6, (G.fight ? G.fight.opp.downs + G.fight.you.downs : 0) * 0.2);
  crowdSeed.forEach((c, i) => {
    const bob = Math.sin(t / 420 + i) * 1.6;
    const g = Math.floor(28 + c.h * 40 * lively);
    circle(c.x, c.y + bob, c.r, `rgb(${g},${g + 4},${g + 10})`);
  });

  // apron / canvas floor, in perspective
  const g = cx.createLinearGradient(0, 96, 0, H);
  g.addColorStop(0, '#1B2430'); g.addColorStop(1, '#39506A');
  cx.fillStyle = g;
  cx.beginPath();
  cx.moveTo(52, 96); cx.lineTo(W - 52, 96); cx.lineTo(W + 60, H); cx.lineTo(-60, H);
  cx.closePath(); cx.fill();

  // canvas floor lines, converging — cheap depth for two triangles' worth of work
  cx.strokeStyle = 'rgba(255,255,255,.05)'; cx.lineWidth = 1;
  for (let i = 1; i < 7; i++) {
    const y = 96 + (H - 96) * (i / 7) * (i / 7);
    cx.beginPath(); cx.moveTo(52 - (y - 96) * 0.6, y); cx.lineTo(W - 52 + (y - 96) * 0.6, y); cx.stroke();
  }

  // corner posts and ropes
  [46, W - 46].forEach(x => { cx.fillStyle = '#4A5462'; cx.fillRect(x - 4, 60, 8, 60); });
  const ropes = ['#D93B2B', '#E8E337', '#3FBF8F'];
  ropes.forEach((c, i) => {
    const y = 74 + i * 16;
    cx.strokeStyle = c; cx.lineWidth = 3; cx.globalAlpha = 0.85;
    cx.beginPath(); cx.moveTo(42, y); cx.lineTo(W - 42, y); cx.stroke();
  });
  cx.globalAlpha = 1;
}

/* --- heads --------------------------------------------------------------- */
/* One head routine, driven by `look`, because seven near-identical draw
   functions would drift the moment one of them got a fix. Everything that makes
   a person recognisable here is a flag: the undercut, the glasses, the beard
   length, the earrings. */
/* ---------------------------------------------------------------------------
   Faces.

   One routine for all seven, driven entirely by `look`. Seven near-identical
   draw functions would drift the moment one of them got a fix, and every
   feature here is a parameter rather than a special case — so a new fighter is
   an array entry, not new drawing code.

   Two jobs, and they are separate:

     - **Likeness.** Face shape, hair, facial hair, glasses and piercings are
       the things people actually recognise each other by, so each is its own
       set of numbers rather than a style keyword. Casey is not "the one with
       glasses", he is a 1.38-width thin metal rectangle and a 23-long beard.

     - **Expression.** The face has to say what the fighter is about to do, half
       a second before he does it. Brows, eyes, jaw and head angle all move on
       `mood`, and the wind-up is deliberately the loudest of them.

   `fx` carries what the fight knows and the look does not: how hurt he is, and
   which way he is leaning.
------------------------------------------------------------------------- */
function drawHead(x, y, s, look, mood, t, fx) {
  fx = fx || {};
  const dmg = Math.max(0, Math.min(1, fx.dmg || 0));   // 0 fresh .. 1 out on his feet
  const turn = Math.max(-1, Math.min(1, fx.turn || 0));
  const seed = look.seed || 0;

  const skin = look.skin, hair = look.hair;
  const F = look.face || { w: 1, jaw: 1, chin: 0.4, cheek: 0.5, chins: 0 };
  const C = look.crop || { style: 'short', vol: 1, part: 0, temples: 0, overEar: 0 };
  const B = look.beard || { type: 'none', len: 0 };
  const BR = look.brow || { th: 1, angle: 0.08, gap: 1 };
  const LP = look.lips || { w: 1, th: 1 };
  const NS = look.nose || { w: 1, len: 1, ring: null };
  const beardCol = B.col || hair;

  const fw = F.w;                       // face width multiplier
  const shadow = shade(skin, -30);
  const deep = shade(skin, -52);

  // Local coordinate helper. Everything below is written in "face units" so a
  // face can be widened without every feature having to be moved by hand.
  const px = (dx) => x + dx * s * fw + turn * 1.6 * s;
  const py = (dy) => y + dy * s;
  const P2 = (dx, dy) => [px(dx), py(dy)];

  /* -- blink -------------------------------------------------------------
     Every 3-4 seconds, offset per fighter so seven of them on a card do not
     blink in unison, which reads as a glitch rather than as people. */
  const period = 3.2 + seed * 0.37;
  const bph = ((t / 1000) + seed * 1.7) % period;
  const blink = bph < 0.15 ? Math.sin((bph / 0.15) * Math.PI) : 0;

  /* -- what the mood does to the face ------------------------------------ */
  // jaw: how far the mouth is open. brow: down(+) or up(-). squint: eyes closing.
  let jaw = 0, browDrop = 0, squint = 0, sneer = 0;
  if (mood === 'wind')      { jaw = 0.85; browDrop = 1.0;  squint = 0.25; sneer = 1; }
  else if (mood === 'guard'){ jaw = 0.05; browDrop = 0.75; squint = 0.35; }
  else if (mood === 'hit')  { jaw = 0.55; browDrop = -0.9; squint = 0.85; }
  else if (mood === 'stun') { jaw = 0.75; browDrop = -0.5; squint = 0; }
  else if (mood === 'down') { jaw = 0.6;  browDrop = -0.3; squint = 0; }

  // Breathing: faster and deeper the more damage he has taken. It is the
  // cheapest way to make a fighter look like he is in trouble.
  const breath = Math.sin(t / (mood === 'idle' ? 620 - dmg * 260 : 420)) * (0.35 + dmg * 0.5);

  /* -- ears (behind the face) -------------------------------------------- */
  const earX = 11.2 * fw;
  const earHidden = (C.overEar || 0) > 0.6;
  if (!earHidden) {
    [-1, 1].forEach(d => {
      ellipse(px(d * earX), py(2.4), 2.4 * s, 3.6 * s, shade(skin, -14));
      ellipse(px(d * earX), py(2.6), 1.1 * s, 1.9 * s, shade(skin, -30));
    });
  }

  /* -- neck --------------------------------------------------------------- */
  cx.fillStyle = shade(skin, -16);
  cx.fillRect(px(-4.6), py(10), 9.2 * s * fw, 8 * s);

  /* -- face --------------------------------------------------------------- */
  // A single path with a tapered jaw. `chin` pulls the point in, `jaw` widens
  // the corners, `cheek` pushes the mid-face out.
  const jw = 9.9 * F.jaw, ck = 11.3 + F.cheek * 1.1, cn = 5.6 * (1 - F.chin * 0.42);
  cx.fillStyle = skin;
  cx.beginPath();
  cx.moveTo(...P2(0, -14.2));
  cx.bezierCurveTo(...P2(ck * 0.72, -14.0), ...P2(ck, -3.4), ...P2(ck * 0.97, 3.2));
  cx.bezierCurveTo(...P2(jw, 9.6), ...P2(cn, 14.6), ...P2(0, 15.2 + F.chin * 0.8));
  cx.bezierCurveTo(...P2(-cn, 14.6), ...P2(-jw, 9.6), ...P2(-ck * 0.97, 3.2));
  cx.bezierCurveTo(...P2(-ck, -3.4), ...P2(-ck * 0.72, -14.0), ...P2(0, -14.2));
  cx.fill();

  // Cheeks, for the fuller faces. Two soft blooms rather than a wider oval —
  // a wide oval reads as a balloon, cheeks read as a person.
  if (F.cheek > 0.55) {
    cx.save(); cx.clip();
    cx.globalAlpha = 0.16 * F.cheek;
    ellipse(px(-6.4), py(4.4), 4.6 * s, 3.6 * s, shade(skin, 26));
    ellipse(px(6.4), py(4.4), 4.6 * s, 3.6 * s, shade(skin, 26));
    cx.globalAlpha = 1; cx.restore();
  }
  // Double chin.
  if (F.chins > 0.1) {
    cx.fillStyle = skin;
    cx.beginPath();
    cx.ellipse(px(0), py(14.2), jw * 0.78 * s, (2.2 + F.chins * 2.6) * s, 0, 0, Math.PI);
    cx.fill();
    cx.globalAlpha = 0.13; cx.strokeStyle = deep; cx.lineWidth = 1.2 * s;
    cx.beginPath(); cx.moveTo(px(-4.4), py(12.6)); cx.quadraticCurveTo(px(0), py(14.4), px(4.4), py(12.6));
    cx.stroke(); cx.globalAlpha = 1;
  }
  // Shading down the side away from the light, plus a brow ridge.
  cx.save();
  cx.beginPath();
  cx.moveTo(...P2(0, -14.2));
  cx.bezierCurveTo(...P2(ck * 0.72, -14.0), ...P2(ck, -3.4), ...P2(ck * 0.97, 3.2));
  cx.bezierCurveTo(...P2(jw, 9.6), ...P2(cn, 14.6), ...P2(0, 15.2));
  cx.bezierCurveTo(...P2(-cn, 14.6), ...P2(-jw, 9.6), ...P2(-ck * 0.97, 3.2));
  cx.bezierCurveTo(...P2(-ck, -3.4), ...P2(-ck * 0.72, -14.0), ...P2(0, -14.2));
  cx.clip();
  cx.globalAlpha = 0.09; cx.fillStyle = '#000';
  cx.fillRect(px(-ck - 1), py(-15), 4.6 * s * fw, 32 * s);
  cx.globalAlpha = 0.07;
  cx.fillRect(px(-ck - 1), py(-15), 26 * s * fw, 3.4 * s);   // under the hairline
  cx.globalAlpha = 1;
  cx.restore();

  /* -- hair --------------------------------------------------------------- */
  const vol = C.vol == null ? 1 : C.vol;
  const part = C.part || 0;
  const capTop = -13.6 - vol * 1.9;

  const cap = (rx, ry, dy, col) => {
    cx.fillStyle = col;
    cx.beginPath();
    cx.ellipse(px(0), py(dy), rx * s * fw, ry * s, 0, Math.PI, Math.PI * 2);
    cx.fill();
  };

  if (C.style === 'bald') {
    // Horseshoe: cropped round the sides and back, bare on top.
    cx.fillStyle = hair;
    cx.beginPath();
    cx.ellipse(px(0), py(-1.5), (ck + 0.5) * s * fw, 12.4 * s, 0, Math.PI * 0.80, Math.PI * 2.20);
    cx.fill();
    cx.fillStyle = skin;
    cx.beginPath();
    cx.ellipse(px(0), py(-3.6), (ck - 1.9) * s * fw, 11.0 * s, 0, Math.PI, Math.PI * 2);
    cx.fill();
    cx.globalAlpha = 0.14;
    ellipse(px(-3.2), py(-9.4), 4.4 * s, 2.2 * s, '#FFF');   // the shine that says bald
    cx.globalAlpha = 1;
  } else if (C.style === 'undercut') {
    // Tight at the sides, height on top swept back off a hard part. The two
    // have to contrast or it just reads as a dark cap — so the sides go
    // LIGHTER, not darker, which is what short hair over scalp actually does.
    cx.fillStyle = shade(hair, 30);
    cx.beginPath();
    cx.ellipse(px(0), py(-2.2), (ck - 0.4) * s * fw, 10.2 * s, 0, Math.PI, Math.PI * 2);
    cx.fill();
    cx.fillStyle = hair;
    cx.beginPath();
    cx.moveTo(...P2(-9.4, -8.6));
    cx.bezierCurveTo(...P2(-8.4, capTop - 2), ...P2(8.6, capTop - 2.6), ...P2(10.2, -9.2));
    cx.bezierCurveTo(...P2(5.6, -12.4), ...P2(-4.6, -12.8), ...P2(-9.4, -8.6));
    cx.fill();
    cap(9.9, 7.6 * vol, -6.4, hair);
    // the swept quiff at the front
    cx.globalAlpha = 0.35; cx.fillStyle = shade(hair, 26);
    cx.beginPath();
    cx.moveTo(...P2(-7.8, -10.8));
    cx.quadraticCurveTo(...P2(-1.5, capTop - 2.2), ...P2(6.2, -12.4));
    cx.quadraticCurveTo(...P2(-1, -11.8), ...P2(-7.8, -10.8));
    cx.fill(); cx.globalAlpha = 1;
  } else if (C.style === 'sweep') {
    // A lot of hair, high at the front and pushed across.
    cap(ck + 1.4, 12.4 * vol, -2.6, hair);
    cx.fillStyle = hair;
    cx.beginPath();
    cx.ellipse(px(part * -3.6), py(-12.6), 7.8 * s, 5.0 * s, part * -0.34, 0, 7);
    cx.fill();
    cx.globalAlpha = 0.16; cx.fillStyle = '#FFF';
    cx.beginPath(); cx.ellipse(px(part * -4.6), py(-11.6), 4.4 * s, 1.5 * s, part * -0.34, 0, 7); cx.fill();
    cx.globalAlpha = 1;
  } else if (C.style === 'part') {
    // Side-parted and wavy, long enough to cover the ears.
    cap(ck + 1.0, 12.2 * vol, -2.2, hair);
    cx.fillStyle = hair;
    const over = 4 + (C.overEar || 0) * 7;
    cx.fillRect(px(-ck - 1.0), py(-4), 3.6 * s, over * s);
    cx.fillRect(px(ck - 2.6), py(-4), 3.6 * s, over * s);
    // the part itself
    cx.globalAlpha = 0.30; cx.strokeStyle = shade(hair, -34); cx.lineWidth = 1.4 * s;
    cx.beginPath(); cx.moveTo(px(part * 3.4), py(-13.4)); cx.quadraticCurveTo(px(part * 6.6), py(-9), px(part * 8.4), py(-5));
    cx.stroke(); cx.globalAlpha = 1;
  } else if (C.style === 'back') {
    // Long, and pulled back off the face — the bundle sits behind the jaw.
    // Tied behind — one bundle, low and mostly hidden behind the jaw.
    ellipse(px(10.2), py(2.8), 3.3 * s, 5.0 * s, shade(hair, -14));
    cap(ck + 0.4, 11.8 * vol, -2.0, hair);
    cx.globalAlpha = 0.34; cx.strokeStyle = shade(hair, -42); cx.lineWidth = 1.1 * s;
    for (let i = -3; i <= 3; i++) {
      cx.beginPath();
      cx.moveTo(px(i * 2.6), py(-13.2));
      cx.quadraticCurveTo(px(i * 3.4), py(-7.4), px(9.2), py(-1.6));
      cx.stroke();
    }
    cx.globalAlpha = 1;
  } else if (C.style === 'wave') {
    cap(ck + 0.6, 11.6 * vol, -3.0, hair);
    cx.fillStyle = hair;
    cx.beginPath(); cx.ellipse(px(4.6), py(-11.8), 6.2 * s, 4.2 * s, 0.40, 0, 7); cx.fill();
    cx.beginPath(); cx.ellipse(px(-4.2), py(-12.2), 5.0 * s, 3.4 * s, -0.30, 0, 7); cx.fill();
  } else { // short
    cap(ck + 0.2, 11.4 * vol, -2.6, hair);
  }

  // Receding temples — cut two notches of skin back into the hairline.
  if (C.temples > 0 && C.style !== 'bald') {
    // Cut the notch INTO the hairline. Placed higher it just floats as two
    // skin-coloured dots in the middle of the hair, which is what it did.
    const hairline = -2.4 - (C.style === 'sweep' || C.style === 'part' ? 0.6 : 0);
    cx.fillStyle = skin;
    [-1, 1].forEach(d => {
      cx.beginPath();
      cx.ellipse(px(d * 8.1), py(hairline - 1.6), 3.0 * s * C.temples, 3.1 * s * C.temples, d * 0.42, 0, 7);
      cx.fill();
    });
  }

  /* -- eyes --------------------------------------------------------------- */
  const eyeY = -1.6, ex = 4.9 * (BR.gap || 1);
  const openBase = mood === 'wind' ? 3.5 : (mood === 'stun' ? 3.0 : 2.75);
  const open = Math.max(0.08, openBase * (1 - squint * 0.8) * (1 - blink * 0.94));

  if (mood === 'down') {
    // Flat crosses. A man on the canvas with alert eyes reads as a man having
    // a lie down, which is not the same thing.
    cx.strokeStyle = '#20140E'; cx.lineWidth = 1.7 * s; cx.lineCap = 'round';
    [-1, 1].forEach(d => {
      const cxx = px(d * ex), cyy = py(eyeY);
      cx.beginPath();
      cx.moveTo(cxx - 2.7 * s, cyy - 2.7 * s); cx.lineTo(cxx + 2.7 * s, cyy + 2.7 * s);
      cx.moveTo(cxx + 2.7 * s, cyy - 2.7 * s); cx.lineTo(cxx - 2.7 * s, cyy + 2.7 * s);
      cx.stroke();
    });
  } else if (mood === 'stun') {
    // Spiral eyes. Cartoon shorthand, and instantly readable at this size.
    [-1, 1].forEach(d => {
      ellipse(px(d * ex), py(eyeY), 3.4 * s, 3.4 * s, '#F6F1EA');
      cx.strokeStyle = '#20140E'; cx.lineWidth = 1.15 * s; cx.lineCap = 'round';
      cx.beginPath();
      for (let i = 0; i <= 26; i++) {
        const a2 = (i / 26) * Math.PI * 3.1 + t / 150 * d;
        const r2 = (i / 26) * 3.0 * s;
        const xx = px(d * ex) + Math.cos(a2) * r2, yy = py(eyeY) + Math.sin(a2) * r2;
        i ? cx.lineTo(xx, yy) : cx.moveTo(xx, yy);
      }
      cx.stroke();
    });
  } else if (mood === 'hit' && squint > 0.8) {
    // Screwed shut.
    cx.strokeStyle = deep; cx.lineWidth = 1.7 * s; cx.lineCap = 'round';
    [-1, 1].forEach(d => {
      cx.beginPath();
      cx.moveTo(px(d * ex - 3.2), py(eyeY + 0.6));
      cx.quadraticCurveTo(px(d * ex), py(eyeY - 1.6), px(d * ex + 3.2), py(eyeY + 0.6));
      cx.stroke();
    });
  } else {
    // Look toward whatever is coming, which is the only "aim" the face has.
    const gaze = mood === 'guard' ? 0 : (mood === 'wind' ? turn * -1.1 : Math.sin(t / 1100 + seed) * 0.6);
    [-1, 1].forEach(d => {
      ellipse(px(d * ex), py(eyeY), 3.15 * s, open * s, '#F6F1EA');
      cx.save();
      cx.beginPath(); cx.ellipse(px(d * ex), py(eyeY), 3.15 * s, open * s, 0, 0, 7); cx.clip();
      circle(px(d * ex + gaze), py(eyeY + 0.2), 1.55 * s, '#3A2A1E');
      circle(px(d * ex + gaze), py(eyeY + 0.2), 0.85 * s, '#140D08');
      circle(px(d * ex + gaze - 0.6), py(eyeY - 0.6), 0.42 * s, '#FFF');
      cx.restore();
      // upper lid, so nobody looks permanently startled
      cx.fillStyle = skin;
      cx.fillRect(px(d * ex - 3.4), py(eyeY) - open * s - 1.5 * s, 6.8 * s * fw, 1.7 * s);
      cx.globalAlpha = 0.30; cx.strokeStyle = deep; cx.lineWidth = 0.9 * s;
      cx.beginPath();
      cx.moveTo(px(d * ex - 3.2), py(eyeY) - open * s);
      cx.quadraticCurveTo(px(d * ex), py(eyeY) - open * s - 1.1 * s, px(d * ex + 3.2), py(eyeY) - open * s);
      cx.stroke(); cx.globalAlpha = 1;
    });
  }

  // Brows. The single loudest part of the telegraph.
  cx.strokeStyle = shade(hair, -22); cx.lineWidth = 2.1 * s * (BR.th || 1); cx.lineCap = 'round';
  const bd = browDrop * 1.9, ba = (BR.angle || 0.08);
  [-1, 1].forEach(d => {
    cx.beginPath();
    cx.moveTo(px(d * (ex + 3.6)), py(eyeY - 5.6 + bd * 0.45 + d * ba * turn));
    cx.quadraticCurveTo(px(d * (ex + 0.2)), py(eyeY - 6.6 + bd * 0.75),
                        px(d * (ex - 3.3)), py(eyeY - 4.4 + bd * 1.05));
    cx.stroke();
  });
  // A furrow between them when he means it.
  if (browDrop > 0.5) {
    cx.globalAlpha = 0.22 * browDrop; cx.strokeStyle = deep; cx.lineWidth = 1.1 * s;
    cx.beginPath(); cx.moveTo(px(-1.1), py(eyeY - 4.4)); cx.lineTo(px(-0.7), py(eyeY - 1.6));
    cx.moveTo(px(1.1), py(eyeY - 4.4)); cx.lineTo(px(0.7), py(eyeY - 1.6));
    cx.stroke(); cx.globalAlpha = 1;
  }

  /* -- nose --------------------------------------------------------------- */
  const nw = NS.w || 1, nl = NS.len || 1;
  cx.strokeStyle = shadow; cx.lineWidth = 1.5 * s; cx.lineCap = 'round';
  cx.beginPath();
  cx.moveTo(px(-0.7), py(0.4));
  cx.quadraticCurveTo(px(-2.4 * nw), py(4.4 * nl), px(0.5), py(5.2 * nl));
  cx.stroke();
  cx.globalAlpha = 0.5;
  ellipse(px(-1.9 * nw), py(5.3 * nl), 0.8 * s, 0.6 * s, deep);
  ellipse(px(1.9 * nw), py(5.3 * nl), 0.8 * s, 0.6 * s, deep);
  cx.globalAlpha = 1;
  if (NS.ring) {
    const d = NS.ring === 'left' ? -1 : 1;
    cx.strokeStyle = '#D9D3C6'; cx.lineWidth = 1.15 * s;
    cx.beginPath(); cx.arc(px(d * 2.3 * nw), py(5.6 * nl), 1.7 * s, -0.6, Math.PI + 0.4); cx.stroke();
  }

  /* -- beard (under the mouth; the mouth is drawn over it) ---------------- */
  const jawOpen = jaw * 2.6;
  if (B.type === 'shadow' || B.type === 'stubble') {
    cx.save();
    cx.globalAlpha = B.type === 'shadow' ? 0.13 : 0.26;
    cx.fillStyle = beardCol;
    cx.beginPath();
    cx.moveTo(...P2(-ck * 0.94, 1.4));
    cx.bezierCurveTo(...P2(-jw, 9.6), ...P2(-cn, 14.6), ...P2(0, 15.2));
    cx.bezierCurveTo(...P2(cn, 14.6), ...P2(jw, 9.6), ...P2(ck * 0.94, 1.4));
    cx.quadraticCurveTo(...P2(0, 7.4), ...P2(-ck * 0.94, 1.4));
    cx.fill();
    cx.restore();
  } else if (B.type !== 'none') {
    const len = B.len || 10, flare = B.flare || 1, point = B.point || 0;
    cx.fillStyle = beardCol;
    if (B.type === 'circle') {
      // Moustache and chin joined in a ring round the mouth, nothing on the cheeks.
      cx.beginPath();
      cx.ellipse(px(0), py(9.0 + jawOpen * 0.4), 5.1 * s, (4.6 + len * 0.15) * s, 0, 0, 7);
      cx.fill();
      cx.globalAlpha = 1;
    } else {
      // Jaw-following: short, full and long are the same shape at three lengths,
      // widening as it falls for the long one.
      // Hug the jaw. Starting at the cheekbone and flaring wider than the
      // skull turned all four bearded fighters into one brown bib.
      const w1 = ck * (B.type === 'short' ? 0.80 : 0.86);
      const tip = 15.2 + len;
      cx.beginPath();
      cx.moveTo(...P2(-w1, 3.2));
      cx.bezierCurveTo(...P2(-w1 * flare, 10 + len * 0.45), ...P2(-cn * flare, tip - 2), ...P2(0, tip + point * 2.2));
      cx.bezierCurveTo(...P2(cn * flare, tip - 2), ...P2(w1 * flare, 10 + len * 0.45), ...P2(w1, 3.2));
      // The upper edge dips low in the middle so the mouth is not buried.
      cx.quadraticCurveTo(...P2(0, 11.4), ...P2(-w1, 3.2));
      cx.fill();
      // a little shape in it rather than one flat slab
      cx.globalAlpha = 0.18; cx.strokeStyle = shade(beardCol, -34); cx.lineWidth = 1.2 * s;
      for (let i = -2; i <= 2; i++) {
        cx.beginPath();
        cx.moveTo(px(i * 2.3), py(11.5));
        cx.quadraticCurveTo(px(i * 2.8), py(13 + len * 0.5), px(i * 1.7), py(tip - 1.5));
        cx.stroke();
      }
      cx.globalAlpha = 1;
    }
    // Moustache over the lip for everything except plain stubble.
    if (B.type !== 'short') ellipse(px(0), py(6.9), 4.5 * s * (LP.w || 1), 1.8 * s, beardCol);
    cx.globalAlpha = 0.22; cx.strokeStyle = shade(beardCol, -40); cx.lineWidth = 0.9 * s;
    cx.beginPath(); cx.moveTo(px(-3.7), py(6.7)); cx.quadraticCurveTo(px(0), py(7.7), px(3.7), py(6.7));
    cx.stroke(); cx.globalAlpha = 1;
  }

  /* -- mouth (over the beard, always) ------------------------------------- */
  const my = 9.4 + breath * 0.15;
  const lw = 4.3 * (LP.w || 1), lt = LP.th || 1;
  const smile = look.smile || 'closed';
  if (jaw > 0.3) {
    // Open: a dark cavity with teeth at the top. Depth follows `jaw`, so the
    // wind-up is a shout and a hit is a grunt.
    const h = (1.6 + jawOpen * 1.15) * s;
    ellipse(px(0), py(my + jawOpen * 0.42), lw * 0.92 * s, h, '#4A1C18');
    ellipse(px(0), py(my - 0.5 + jawOpen * 0.10), lw * 0.80 * s, 1.05 * s, '#F2E9DE');
    if (jaw > 0.6) ellipse(px(0), py(my + jawOpen * 0.86), lw * 0.62 * s, 0.8 * s, '#C86B62');  // tongue
  } else if (smile === 'open' && mood === 'idle') {
    // A real grin with teeth — two of the seven actually smile like this.
    ellipse(px(0), py(my + 0.4), lw * 1.02 * s, 2.3 * s, '#4A1C18');
    ellipse(px(0), py(my - 0.35), lw * 0.92 * s, 1.35 * s, '#F4ECE2');
    cx.globalAlpha = 0.35; cx.strokeStyle = '#B8A99B'; cx.lineWidth = 0.7 * s;
    for (let i = -2; i <= 2; i++) {
      cx.beginPath(); cx.moveTo(px(i * 1.5), py(my - 1.6)); cx.lineTo(px(i * 1.5), py(my + 0.9)); cx.stroke();
    }
    cx.globalAlpha = 1;
  } else {
    cx.strokeStyle = '#7A3A2E'; cx.lineWidth = 1.9 * s * lt; cx.lineCap = 'round';
    cx.beginPath();
    if (smile === 'smirk') {
      // Up one side only.
      cx.moveTo(px(-lw), py(my + 0.5));
      cx.quadraticCurveTo(px(0), py(my + 1.5), px(lw), py(my - 1.1));
    } else {
      const curve = mood === 'guard' ? -1.5 : (smile === 'closed' ? 1.7 : 0.6);
      cx.moveTo(px(-lw), py(my));
      cx.quadraticCurveTo(px(0), py(my + curve), px(lw), py(my));
    }
    cx.stroke();
  }
  if (sneer) {
    // Nose wrinkle on the wind-up.
    cx.globalAlpha = 0.24; cx.strokeStyle = deep; cx.lineWidth = 1.0 * s;
    cx.beginPath(); cx.moveTo(px(-2.6), py(5.6)); cx.quadraticCurveTo(px(0), py(4.6), px(2.6), py(5.6));
    cx.stroke(); cx.globalAlpha = 1;
  }

  /* -- damage ------------------------------------------------------------
     Punch-Out told you how a fight was going by the state of the other man's
     face, and it is far more readable than watching a bar. Swelling first,
     then colour, then a cut. */
  if (dmg > 0.18) {
    const k = (dmg - 0.18) / 0.82;
    cx.globalAlpha = 0.30 * k;
    ellipse(px(-ex), py(eyeY + 3.3), 3.5 * s, 1.5 * s * (0.5 + k), '#8C3A2E');   // swelling under the eye
    ellipse(px(ex), py(eyeY + 3.3), 3.1 * s, 1.3 * s * (0.5 + k), '#8C3A2E');
    cx.globalAlpha = 0.20 * k;
    ellipse(px(-6.9), py(4.0), 3.2 * s, 2.4 * s, '#C2483A');                     // colour in the cheeks
    ellipse(px(6.9), py(4.0), 3.2 * s, 2.4 * s, '#C2483A');
    cx.globalAlpha = 1;
  }
  if (dmg > 0.55) {
    // A cut over the eye, and it runs.
    const k = (dmg - 0.55) / 0.45;
    cx.strokeStyle = '#A3231B'; cx.lineWidth = 1.5 * s;
    cx.beginPath(); cx.moveTo(px(-ex - 2.6), py(eyeY - 6.4)); cx.lineTo(px(-ex + 1.4), py(eyeY - 5.2)); cx.stroke();
    cx.globalAlpha = 0.75;
    cx.fillStyle = '#8E1C15';
    cx.fillRect(px(-ex - 1.0), py(eyeY - 5.4), 0.9 * s, (2.5 + k * 6) * s);
    cx.globalAlpha = 1;
  }
  if (dmg > 0.30) {
    // Sweat, falling on its own clock so it never lines up with the bobbing.
    cx.globalAlpha = 0.55;
    for (let i = 0; i < 3; i++) {
      const ph = ((t / 900) + i * 0.37 + seed * 0.2) % 1;
      const dx0 = [-8.4, 7.9, 4.2][i], dy0 = [-9, -10.4, -11.6][i];
      ellipse(px(dx0), py(dy0 + ph * 13), 0.95 * s, 1.5 * s, '#BFE2F2');
    }
    cx.globalAlpha = 1;
  }

  /* -- glasses (over the beard and the damage, they sit on the face) ------ */
  if (look.glasses) {
    const G2 = look.glasses;
    const gw = 5.05 * (G2.w || 1), gh = 4.05 * (G2.h || 1);
    cx.lineWidth = 1.05 * s * (G2.th || 1);
    cx.strokeStyle = G2.frame || '#23272E';
    [-1, 1].forEach(d => {
      cx.fillStyle = 'rgba(205,228,246,' + (G2.tint == null ? 0.07 : G2.tint) + ')';
      cx.beginPath();
      if (G2.shape === 'aviator') {
        cx.ellipse(px(d * ex), py(eyeY + 0.4), gw * s, gh * s, 0, 0, 7);
      } else {
        // Rounded rectangle — square frames are a different face from round ones.
        const rx0 = px(d * ex) - gw * s, ry0 = py(eyeY) - gh * s;
        const rw = gw * 2 * s, rh = gh * 2 * s, rr0 = 1.6 * s;
        cx.moveTo(rx0 + rr0, ry0);
        cx.arcTo(rx0 + rw, ry0, rx0 + rw, ry0 + rh, rr0);
        cx.arcTo(rx0 + rw, ry0 + rh, rx0, ry0 + rh, rr0);
        cx.arcTo(rx0, ry0 + rh, rx0, ry0, rr0);
        cx.arcTo(rx0, ry0, rx0 + rw, ry0, rr0);
        cx.closePath();
      }
      cx.fill(); cx.stroke();
      // a glint, so they read as glass rather than as holes
      // A narrow diagonal streak. A wide one filled the lens and turned
      // every bespectacled fighter into a man wearing two white tiles.
      cx.globalAlpha = 0.16; cx.fillStyle = '#FFF';
      cx.beginPath();
      cx.moveTo(px(d * ex - gw * 0.55), py(eyeY + gh * 0.55));
      cx.lineTo(px(d * ex - gw * 0.25), py(eyeY - gh * 0.75));
      cx.lineTo(px(d * ex - gw * 0.02), py(eyeY - gh * 0.75));
      cx.lineTo(px(d * ex - gw * 0.32), py(eyeY + gh * 0.55));
      cx.closePath(); cx.fill(); cx.globalAlpha = 1;
    });
    cx.beginPath();
    cx.moveTo(px(-ex + gw), py(eyeY)); cx.lineTo(px(ex - gw), py(eyeY));       // bridge
    cx.moveTo(px(-ex - gw), py(eyeY - 0.4)); cx.lineTo(px(-earX * 0.94), py(eyeY + 1.0));  // arms
    cx.moveTo(px(ex + gw), py(eyeY - 0.4)); cx.lineTo(px(earX * 0.94), py(eyeY + 1.0));
    cx.stroke();
  }

  /* -- piercings (last; nothing should cover them) ------------------------ */
  if (look.ear && look.ear.studs && !earHidden) {
    const kind = look.ear.studs;
    [-1, 1].forEach(d => {
      if (kind === 'hoop') {
        cx.strokeStyle = '#E4DCC6'; cx.lineWidth = 0.95 * s;
        cx.beginPath(); cx.arc(px(d * earX * 0.99), py(5.6), 1.35 * s, 0, 7); cx.stroke();
      } else {
        circle(px(d * earX), py(5.9), 1.55 * s, '#E8E0C8');
        cx.globalAlpha = 0.6; circle(px(d * earX - 0.4), py(5.5), 0.6 * s, '#FFF'); cx.globalAlpha = 1;
      }
    });
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return `rgb(${r},${g},${b})`;
}

/* --- the opponent -------------------------------------------------------- */
function drawOpponent(f, t) {
  const o = f.opp, L = f.R.look;
  const s = 1.5 * (0.94 + L.build * 0.08);      // overall size
  const bw = 26 * L.build;                      // body half-width

  const p = o.dur > 0 ? Math.min(1, o.t / o.dur) : 0;
  let lean = 0, drop = 0, bob = Math.sin(t / 380) * 1.4;
  let mood = 'idle';
  let armL = { x:-bw - 6, y:-58, r:9 }, armR = { x:bw + 6, y:-58, r:9 };
  let strikeGlove = null;

  if (o.state === 'guard') {
    mood = 'guard';
    armL = { x:-9, y:-74, r:10 }; armR = { x:9, y:-74, r:10 };
  } else if (o.state === 'wind') {
    mood = 'wind';
    const k = o.move.k, e = p * p;
    if (k === 'hookL') { lean = -7 * e; armL = { x:-bw - 18 * e, y:-66 - 6 * e, r:10 }; }
    else if (k === 'hookR') { lean = 7 * e; armR = { x:bw + 18 * e, y:-66 - 6 * e, r:10 }; }
    else if (k === 'low') { drop = 7 * e; armR = { x:bw + 8, y:-40 - 6 * e, r:10 }; armL = { x:-bw - 8, y:-40 - 6 * e, r:10 }; }
    else if (k === 'upper') { drop = 10 * e; armR = { x:bw + 4, y:-26 - 4 * e, r:11 }; }
    else { armR = { x:bw - 2, y:-62 - 4 * e, r:9.6 }; }
  } else if (o.state === 'strike') {
    mood = 'wind';
    const e = Math.min(1, o.t / Math.max(1, o.dur));
    // the glove comes at the camera: it grows and moves toward the middle
    const gx = (o.move.k === 'hookL' ? -1 : o.move.k === 'hookR' ? 1 : 0) * (1 - e) * 30;
    const gy = o.move.k === 'low' ? -18 : o.move.k === 'upper' ? -6 : -50;
    strikeGlove = { x: gx, y: gy + e * 44, r: 10 + e * 22 };
    lean = o.move.k === 'hookL' ? 6 : o.move.k === 'hookR' ? -6 : 0;
  } else if (o.state === 'recover') {
    mood = 'idle';
    armL = { x:-bw - 4, y:-52, r:9 }; armR = { x:bw + 4, y:-52, r:9 };
  } else if (o.state === 'whiff') {
    mood = 'hit'; lean = Math.sin(t / 90) * 4;
    armL = { x:-bw - 14, y:-40, r:9 }; armR = { x:bw + 14, y:-40, r:9 };
  } else if (o.state === 'stun') {
    mood = 'stun'; lean = Math.sin(t / 70) * 6; drop = 3;
    armL = { x:-bw - 12, y:-34, r:9 }; armR = { x:bw + 12, y:-34, r:9 };
  } else if (o.state === 'down') {
    mood = 'down';
  }

  cx.save();
  cx.translate(OX, FLOOR);

  // shadow
  cx.globalAlpha = 0.4; ellipse(0, 2, 34 * L.build, 7, '#05070B'); cx.globalAlpha = 1;

  if (o.state === 'down') {
    // flat out on the canvas, feet toward us
    cx.save(); cx.translate(0, -10);
    ellipse(0, 4, 46, 15, shade(L.trunk, -26));
    ellipse(-16, -2, 16, 12, L.skin);
    drawHead(24, -6, s * 0.82, L, 'down', t, { dmg: Math.min(1, 0.5 + o.downs * 0.25) });
    circle(-34, 2, 11, L.glove); circle(30, 10, 11, L.glove);
    cx.restore();
    cx.restore();
    return;
  }

  cx.translate(lean, bob + drop);

  const rallyGlow = o.rally && o.state !== 'down';
  if (rallyGlow) {
    cx.globalAlpha = 0.16 + Math.sin(t / 140) * 0.06;
    ellipse(0, -60, bw + 26, 62, '#FF4D3D');
    cx.globalAlpha = 1;
  }

  // legs
  rr(-bw * 0.62, -34, 15, 34, 5, shade(L.skin, -18));
  rr(bw * 0.62 - 15, -34, 15, 34, 5, shade(L.skin, -18));
  // boots
  rr(-bw * 0.66, -8, 18, 10, 3, '#20242B');
  rr(bw * 0.66 - 18, -8, 18, 10, 3, '#20242B');

  // trunks
  rr(-bw * 0.86, -60, bw * 1.72, 32, 7, L.trunk);
  cx.fillStyle = L.belt; cx.fillRect(-bw * 0.86, -60, bw * 1.72, 6);

  // torso
  rr(-bw * 0.8, -96, bw * 1.6, 40, 10, L.skin);
  // chest shading, so a flat colour does not read as cardboard
  cx.globalAlpha = 0.10; rr(-bw * 0.8, -96, bw * 0.5, 40, 10, '#000'); cx.globalAlpha = 1;

  // head
  const headY = -114;
  // Damage is cumulative across the fight, not just the current health bar —
  // health resets on every knockdown, and a man who has been down twice should
  // not look fresh again. Knockdowns carry most of the weight.
  const dmg = Math.min(1, o.downs * 0.28 + (1 - o.hp / o.max) * 0.55);
  drawHead(0, headY, s, L, mood, t, { dmg, turn: Math.max(-1, Math.min(1, lean / 7)) });

  // arms and gloves
  [[armL, -1], [armR, 1]].forEach(([a, side]) => {
    cx.strokeStyle = shade(L.skin, -8); cx.lineWidth = 9;
    cx.beginPath(); cx.moveTo(side * bw * 0.66, -90); cx.lineTo(a.x, a.y); cx.stroke();
    circle(a.x, a.y, a.r, L.glove);
    cx.globalAlpha = 0.25; circle(a.x - 2, a.y - 2, a.r * 0.55, '#FFF'); cx.globalAlpha = 1;
  });

  // hit flash
  if (o.flash > 0) {
    cx.globalAlpha = o.flash * 0.6;
    rr(-bw * 0.9, -120, bw * 1.8, 120, 12, '#FFF');
    cx.globalAlpha = 1;
  }

  // the incoming glove is drawn last, over everything, big
  if (strikeGlove) {
    cx.globalAlpha = 0.25;
    circle(strikeGlove.x, strikeGlove.y, strikeGlove.r * 1.25, '#000');
    cx.globalAlpha = 1;
    circle(strikeGlove.x, strikeGlove.y, strikeGlove.r, L.glove);
    cx.globalAlpha = 0.3; circle(strikeGlove.x - strikeGlove.r * 0.3, strikeGlove.y - strikeGlove.r * 0.3, strikeGlove.r * 0.4, '#FFF');
    cx.globalAlpha = 1;
  }

  cx.restore();

  // The tell. Colour is the whole readability of this game: yellow you may
  // block, red you must move. Punch-Out had you learn that from animation
  // alone; a break-room game gets three minutes of somebody's attention, so it
  // says so out loud as well as animating it.
  if (o.state === 'wind' && o.move.k !== 'feint') {
    const warn = !o.move.block;
    const a = 0.20 + 0.35 * Math.sin(Math.min(1, o.t / o.dur) * Math.PI);
    cx.globalAlpha = a;
    const side = o.move.dodge === 'L' ? -1 : o.move.dodge === 'R' ? 1 : 0;
    cx.fillStyle = warn ? '#FF4D3D' : '#E8E337';
    if (side === 0) { cx.fillRect(0, 96, W, 10); cx.fillRect(0, 96, 10, H - 96); cx.fillRect(W - 10, 96, 10, H - 96); }
    else if (side < 0) cx.fillRect(0, 96, 22, H - 96);
    else cx.fillRect(W - 22, 96, 22, H - 96);
    cx.globalAlpha = 1;
  }
}

/* --- you ----------------------------------------------------------------- */
function drawPlayer(f, t) {
  const y = f.you;
  let ox = 0, gy = 0, glL = { x:-64, y:284 }, glR = { x:64, y:284 };

  if (y.state === 'dodge') {
    const e = Math.sin(Math.min(1, y.t / y.dur) * Math.PI);
    ox = (y.punch === 'L' ? -1 : 1) * 40 * e;
  } else if (y.state === 'hurt') {
    ox = Math.sin(y.t / 40) * 5; gy = 8;
  } else if (y.state === 'punch' || y.state === 'star') {
    const windEnd = y.state === 'star' ? P.starWind : P.punchWind;
    const total = y.dur;
    const e = y.t < windEnd ? -(y.t / windEnd) * 0.25 : Math.sin(Math.min(1, (y.t - windEnd) / (total - windEnd)) * Math.PI);
    const hand = y.punch === 'L' ? glL : glR;
    hand.x += (y.punch === 'L' ? 1 : -1) * 46 * e;
    hand.y -= (y.aim === 'face' ? 96 : 62) * e;
  }
  if (held.block && y.state === 'idle') { glL = { x:-26, y:262 }; glR = { x:26, y:262 }; }

  cx.save();
  cx.translate(ox, gy);

  // shoulders and the back of your head — a silhouette, so it never competes
  // with the thing you are supposed to be reading
  cx.fillStyle = '#10141A';
  cx.beginPath();
  cx.moveTo(W / 2 - 108, H); cx.quadraticCurveTo(W / 2 - 60, 272, W / 2 - 26, 268);
  cx.lineTo(W / 2 + 26, 268); cx.quadraticCurveTo(W / 2 + 60, 272, W / 2 + 108, H);
  cx.closePath(); cx.fill();
  ellipse(W / 2, 268, 24, 22, '#161B22');

  const gassed = y.gassedT > 0 || y.hearts <= 0;
  const gloveCol = gassed ? '#E86FA8' : '#E8E337';
  [glL, glR].forEach(g2 => {
    circle(W / 2 + g2.x, g2.y, 17, gloveCol);
    cx.globalAlpha = 0.25; circle(W / 2 + g2.x - 5, g2.y - 5, 7, '#FFF'); cx.globalAlpha = 1;
    cx.globalAlpha = 0.35; cx.strokeStyle = '#000'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(W / 2 + g2.x, g2.y, 17, 0, 7); cx.stroke(); cx.globalAlpha = 1;
  });
  cx.restore();

  if (y.flash > 0) {
    cx.globalAlpha = y.flash * 0.35; cx.fillStyle = '#FF4D3D'; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1;
  }
}

/* --- HUD ----------------------------------------------------------------- */
function drawHUD(f) {
  const o = f.opp, y = f.you;

  // opponent bar
  cx.fillStyle = 'rgba(5,7,11,.75)'; cx.fillRect(0, 0, W, 26);
  mono(f.R.nick, 8, 12, 9, f.R.corner, 'left');
  mono(f.R.name.toUpperCase(), 8, 22, 8, 'rgba(139,148,163,.75)', 'left');

  const bw = 150, bx = W - bw - 8;
  cx.fillStyle = '#20242B'; cx.fillRect(bx, 6, bw, 8);
  cx.fillStyle = o.rally ? '#FF4D3D' : f.R.corner;
  cx.fillRect(bx, 6, bw * Math.max(0, o.hp / o.max), 8);
  cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.lineWidth = 1; cx.strokeRect(bx + .5, 6.5, bw - 1, 7);
  for (let i = 0; i < 3; i++) {
    circle(bx + bw - 6 - i * 12, 20, 3.5, i < o.downs ? '#FF4D3D' : 'rgba(139,148,163,.3)');
  }

  // round and clock
  const secs = Math.max(0, Math.ceil(f.roundLeft / 1000));
  mono(`R${f.round}`, W / 2 - 26, 13, 10, '#8B94A3', 'center');
  text(String(secs).padStart(2, '0'), W / 2 + 12, 15, 14, secs <= 10 ? '#FF4D3D' : '#E8E337', 'center');
  mono(fmt(f.clock / 1000), W / 2, 23, 8, 'rgba(139,148,163,.7)', 'center');

  // your strip
  cx.fillStyle = 'rgba(5,7,11,.8)'; cx.fillRect(0, H - 20, W, 20);
  // hearts as a bar of ticks — a number would be read as a score
  const hn = Math.max(0, Math.round(y.hearts));
  for (let i = 0; i < P.hearts; i++) {
    const on = i < hn;
    cx.fillStyle = on ? (hn <= 6 ? '#FF4D3D' : '#E8637F') : 'rgba(139,148,163,.18)';
    cx.fillRect(8 + i * 6, H - 15, 4, 10);
  }
  // your health
  const pbw = 90, pbx = W - pbw - 8;
  cx.fillStyle = '#20242B'; cx.fillRect(pbx, H - 15, pbw, 10);
  cx.fillStyle = y.hp > 35 ? '#3FBF8F' : '#FF4D3D';
  cx.fillRect(pbx, H - 15, pbw * Math.max(0, y.hp / P.hp), 10);
  // stars
  for (let i = 0; i < P.maxStars; i++) {
    text('★', W / 2 - 20 + i * 18, H - 6, 13, i < y.stars ? '#E8E337' : 'rgba(139,148,163,.22)');
  }
}

/* --- overlays ------------------------------------------------------------ */
function drawIntro(f) {
  cx.fillStyle = 'rgba(5,7,11,.82)'; cx.fillRect(0, 0, W, H);
  const R = f.R;
  cx.save(); cx.translate(0, -6);
  drawHead(W / 2, 96, 2.6, R.look, 'idle', performance.now());
  cx.restore();
  mono(`FIGHT ${f.i + 1} OF ${ROSTER.length}`, W / 2, 146, 9, '#8B94A3');
  text(R.nick, W / 2, 172, 22, R.corner);
  text(R.name, W / 2, 194, 15, '#E8E337');
  mono(R.title.toUpperCase(), W / 2, 210, 9, '#8B94A3');
  wrap(R.line, W / 2, 234, 300, 11, 'rgba(139,148,163,.85)');
}

function wrap(str, x, y, maxw, size, fill) {
  cx.font = `${size}px 'IBM Plex Mono', monospace`;
  const words = str.split(' ');
  let line = '', yy = y;
  const lines = [];
  for (const w2 of words) {
    const test = line ? line + ' ' + w2 : w2;
    if (cx.measureText(test).width > maxw && line) { lines.push(line); line = w2; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.forEach(l => { mono(l, x, yy, size, fill); yy += size + 4; });
}

function drawTitle(t) {
  drawRing(t);
  cx.fillStyle = 'rgba(5,7,11,.72)'; cx.fillRect(0, 0, W, H);
  text('HARVEST', W / 2, 96, 30, '#8BC542');
  text('PUNCH-OUT', W / 2, 128, 30, '#E8E337');
  mono('SEVEN FIGHTS. START AT THE BOTTOM.', W / 2, 154, 10, '#8B94A3');
  wrap('Learn the wind-up. Yellow you can block, red you have to dodge. Punch during the wind-up to counter and earn a star.',
       W / 2, 186, 320, 10.5, 'rgba(139,148,163,.85)');
  if (Math.floor(t / 500) % 2 === 0) mono('PRESS ENTER OR TAP TO BEGIN', W / 2, 250, 11, '#E8E337');
  mono('THREE ROUNDS. NO DECISION — WIN IT INSIDE THE DISTANCE.', W / 2, 274, 8.5, 'rgba(139,148,163,.6)');
}

function drawSelect(t) {
  drawRing(t);
  cx.fillStyle = 'rgba(5,7,11,.80)'; cx.fillRect(0, 0, W, H);
  mono('THE CARD', W / 2, 26, 10, '#8B94A3');

  const beaten = progress();
  ROSTER.forEach((R, i) => {
    const y = 46 + i * 27;
    const done = i < beaten, now = i === G.idx, locked = i > beaten;
    cx.globalAlpha = locked ? 0.32 : 1;
    if (now) { cx.fillStyle = 'rgba(232,227,55,.12)'; cx.fillRect(18, y - 14, W - 36, 24); }
    circle(34, y - 3, 9, done ? '#3FBF8F' : (locked ? '#2A3038' : R.corner));
    mono(String(i + 1), 34, y, 9, '#05070B');
    mono(R.nick, 52, y - 5, 10, now ? '#E8E337' : (done ? '#3FBF8F' : '#8B94A3'), 'left');
    mono(R.name, 52, y + 5, 8.5, 'rgba(139,148,163,.75)', 'left');
    mono(R.title.toUpperCase(), W - 20, y, 7.5, 'rgba(139,148,163,.55)', 'right');
    if (done) mono('BEATEN', W - 20, y - 8, 7.5, '#3FBF8F', 'right');
    cx.globalAlpha = 1;
  });

  const next = ROSTER[G.idx];
  if (Math.floor(t / 500) % 2 === 0) {
    mono(`ENTER OR TAP — FIGHT ${next.nick}`, W / 2, 258, 10, '#E8E337');
  }
  mono(G.idx === 0 ? 'STARTING FROM THE TOP — THIS RUN COUNTS FOR THE CIRCUIT'
                   : 'PICKING UP MID-CARD — NO CIRCUIT TIME FROM HERE',
       W / 2, 276, 8, 'rgba(139,148,163,.6)');
}

function drawResult(f, t) {
  const win = f.result === 'win';
  cx.fillStyle = win ? 'rgba(10,26,14,.86)' : 'rgba(26,8,8,.86)'; cx.fillRect(0, 0, W, H);
  text(win ? 'WINNER' : 'YOU LOSE', W / 2, 84, 30, win ? '#3FBF8F' : '#FF4D3D');
  mono(f.why.toUpperCase(), W / 2, 106, 10, '#E8E337');
  drawHead(W / 2, 156, 2.0, f.R.look, win ? 'down' : 'idle', t, { dmg: win ? 0.9 : 0.15 });
  mono(f.R.name.toUpperCase(), W / 2, 194, 10, '#8B94A3');
  text(fmt(f.clock / 1000), W / 2, 220, 20, '#E8E337');
  mono(win ? 'TIME ON THE BOARD' : 'TIME SPENT', W / 2, 234, 8, 'rgba(139,148,163,.7)');
  if (G.pending) {
    if (Math.floor(t / 400) % 2 === 0) mono('TOP TEN — SIGN IT BELOW', W / 2, 262, 10, '#E8E337');
  } else if (Math.floor(t / 500) % 2 === 0) {
    mono(win && f.i < ROSTER.length - 1 ? 'ENTER — NEXT FIGHT' : 'ENTER — CONTINUE', W / 2, 262, 10, '#E8E337');
  }
}

function drawDone(t) {
  drawRing(t);
  cx.fillStyle = 'rgba(5,7,11,.84)'; cx.fillRect(0, 0, W, H);
  text('CHAMPION', W / 2, 100, 30, '#D4AF37');
  wrap('All seven. Production managers, the warehouse, and the whole C-suite.',
       W / 2, 132, 320, 11, '#8B94A3');
  mono('THE BOARD IS BELOW. SOMEBODY WILL BEAT IT.', W / 2, 174, 9.5, 'rgba(139,148,163,.7)');
  if (Math.floor(t / 500) % 2 === 0) mono('ENTER — BACK TO THE CARD', W / 2, 210, 10, '#E8E337');
}

function drawCount(f, forYou) {
  const n = Math.min(10, Math.floor(f.count) + 1);
  cx.fillStyle = 'rgba(5,7,11,.45)'; cx.fillRect(0, 96, W, H - 96);
  text(String(n), W / 2, 190, 64, 'rgba(232,227,55,.85)');
  if (forYou) {
    mono('MASH BODY / FACE TO GET UP', W / 2, 214, 10, '#E8E337');
    cx.fillStyle = '#20242B'; cx.fillRect(W / 2 - 70, 224, 140, 10);
    cx.fillStyle = '#3FBF8F'; cx.fillRect(W / 2 - 70, 224, 140 * Math.min(1, f.mash), 10);
  } else {
    mono('STAY DOWN', W / 2, 214, 10, 'rgba(139,148,163,.8)');
  }
}

/* ============================ loop ======================================= */
let last = performance.now();

function frame(now) {
  let dt = now - last; last = now;
  if (dt > 60) dt = 60;            // a backgrounded tab must not resolve a round

  if (!G.paused) {
    if (G.screen === 'fight') {
      updateFight(dt);
      const f = G.fight;
      if (f && f.phase === 'over' && f.pt > 900 && G.screen === 'fight') onFightOver();
    }
    if (G.msgT > 0) G.msgT -= dt;
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt / 45);
    if (G.flash > 0) G.flash = Math.max(0, G.flash - dt / 260);
  }

  cx.save();
  if (G.shake > 0) cx.translate((Math.random() - .5) * G.shake, (Math.random() - .5) * G.shake);

  if (G.screen === 'title') drawTitle(now);
  else if (G.screen === 'select') drawSelect(now);
  else if (G.screen === 'done') drawDone(now);
  else if (G.screen === 'fight' || G.screen === 'result') {
    const f = G.fight;
    drawRing(now);
    if (f) {
      if (f.phase !== 'intro') { drawOpponent(f, now); drawPlayer(f, now); drawHUD(f); }
      if (f.phase === 'intro') drawIntro(f);
      else if (f.phase === 'ready') {
        text(`ROUND ${f.round}`, W / 2, 160, 26, '#E8E337');
        mono('BOX', W / 2, 182, 12, '#8B94A3');
      } else if (f.phase === 'rest') {
        cx.fillStyle = 'rgba(5,7,11,.7)'; cx.fillRect(0, 96, W, H - 96);
        text('END OF ROUND ' + f.round, W / 2, 170, 18, '#E8E337');
        mono('CORNER — STAMINA BACK', W / 2, 192, 9.5, '#8B94A3');
      } else if (f.phase === 'downOpp') drawCount(f, false);
      else if (f.phase === 'downYou') drawCount(f, true);

      if (G.msgT > 0 && f.phase === 'fight') {
        cx.globalAlpha = Math.min(1, G.msgT / 300);
        text(G.msg, W / 2, 130, 18, '#E8E337');
        cx.globalAlpha = 1;
      }
    }
    if (G.screen === 'result' && f) drawResult(f, now);
  }

  if (G.flash > 0) { cx.globalAlpha = G.flash * 0.5; cx.fillStyle = '#FFF'; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; }
  cx.restore();

  if (G.paused) {
    cx.fillStyle = 'rgba(5,7,11,.75)'; cx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, 150, 24, '#E8E337');
    mono('CLICK, TAP OR PRESS ANY KEY TO CARRY ON', W / 2, 172, 9.5, '#8B94A3');
    mono('(it pauses itself when you switch away)', W / 2, 188, 8, 'rgba(139,148,163,.6)');
  }

  requestAnimationFrame(frame);
}

/* A backgrounded tab should not be losing a round it cannot see — and it should
   not be making a sound either. The crowd is a looping buffer that runs from the
   first click to the end of the page's life, so "hidden" has to suspend the
   whole audio context, not just stop the music. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G.screen === 'fight') G.paused = true;
    Snd.suspend();          // unconditional: every screen, paused or not
  } else if (!G.paused) {
    Snd.wake();
  }
});
// Closing the tab, or the Hub navigating away from the Arcade, unmounts this
// without a visibilitychange in some browsers.
addEventListener('pagehide', () => Snd.suspend());

/* ---------------------------------------------------------------------------
   ?faces — a contact sheet of all seven against every expression and a damaged
   pass. Tuning a face by playing seven fights to reach it is how faces end up
   untuned; this is the only way to see them together. Not linked from anywhere.
------------------------------------------------------------------------- */
if (new URLSearchParams(location.search).has('faces')) {
  const MOODS = ['idle', 'guard', 'wind', 'hit', 'stun', 'down'];
  // ?faces&s=1.6 renders at the size the ring actually draws a head, which is
  // the only scale that matters — detail that only reads at 3x is decoration.
  const SC = Number(new URLSearchParams(location.search).get('s')) || 3.1;
  const CW = Math.round(48 * SC), CH = Math.round(57 * SC);
  cv.width = 90 + MOODS.length * CW + CW;      // one extra column for damage
  cv.height = 42 + ROSTER.length * CH;
  cv.style.imageRendering = 'auto';
  (function sheet(now) {
    cx.fillStyle = '#0A0C10'; cx.fillRect(0, 0, cv.width, cv.height);
    MOODS.forEach((m, i) => mono(m.toUpperCase(), 90 + i * CW + CW / 2, 26, 12, '#E8E337'));
    mono('DAMAGED', 90 + MOODS.length * CW + CW / 2, 26, 12, '#FF4D3D');
    ROSTER.forEach((R, r) => {
      const yy = 42 + r * CH + CH * 0.52;
      mono(R.name, 8, yy - 6, 11, '#8B94A3', 'left');
      mono(R.nick, 8, yy + 8, 9, 'rgba(139,148,163,.6)', 'left');
      MOODS.forEach((m, i) => drawHead(90 + i * CW + CW / 2, yy, SC, R.look, m, now));
      drawHead(90 + MOODS.length * CW + CW / 2, yy, SC, R.look, 'idle', now, { dmg: 0.85 });
    });
    requestAnimationFrame(sheet);
  })(performance.now());
} else {
  setProgress(progress());
  loadBoard();
  requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
